name: iOS Build (unsigned, personal)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    env:
      # Xcode 26.3 SDK => Liquid Glass styling (floating glass tab bar,
      # glassEffect materials) at runtime on iOS 26.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: |
          cat > project.yml <<'EOF'
          name: AIO
          options:
            bundleIdPrefix: com.orhogi
            deploymentTarget:
              iOS: "16.0"
          targets:
            AIO:
              type: application
              platform: iOS
              sources: [AIO]
              entitlements: AIO/AIO.entitlements
              settings:
                base:
                  INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
                  SWIFT_VERSION: "5.9"
                  TARGETED_DEVICE_FAMILY: "1"
                  GENERATE_INFOPLIST_FILE: YES
                  CODE_SIGNING_ALLOWED: "NO"
                  CODE_SIGN_IDENTITY: ""
          EOF
          xcodegen generate
          test -f AIO.xcodeproj/project.pbxproj

      - name: Build IPA
        run: |
          set -euo pipefail
          xcodebuild -project AIO.xcodeproj \
            -scheme AIO \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -quiet

          APP=$(find build/Build/Products -name "*.app" -type d | head -1)
          test -n "$APP"
          mkdir -p Payload artifacts
          cp -R "$APP" Payload/
          zip -qry artifacts/AIO.ipa Payload
          ls -la artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: AIO-ipa
          path: artifacts/AIO.ipa
          retention-days: 14
